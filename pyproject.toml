[project]
name = "soundpulse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "torch==2.1.2",
    "torchaudio==2.1.2",
    "numpy>=1.22.0,<2.0.0",
    "ffmpeg-python>=0.2.0",
    "python-dotenv>=1.0.0",
    "transformers>=4.35.0",
    "omegaconf>=2.3.0",
    "setuptools<70.0.0",
    "pyarrow<15.0.0",
    "datasets==2.10.1",
    "faster-whisper==0.10.1",
    "pydantic>=2.13.4",
    "openai>=3.1.0",
    "python-multipart>=0.0.32",
    "fpdf2>=2.8.8",
    "scikit-learn>=1.7.2",
    "speechbrain==0.5.16",
    "soundfile>=0.14.0",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "flower>=2.0.0"
]
[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchaudio = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.extra-build-dependencies]
youtokentome = ["Cython<3.0.0", "setuptools"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.uv]
override-dependencies = [
    "av>=11.0.0"
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "data", "models", "exports"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]